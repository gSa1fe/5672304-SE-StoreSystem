<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | SE - Store System</title>
  <link rel="icon" type="image/png" href="../assets/images/branding/logo.png">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/pages/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- แถบเมนูด้านบน -->
  <app-header active-page="login" base-path=".."></app-header>

  <!-- ฟอร์มเข้าสู่ระบบ -->
  <main class="container auth-page-main">
    <div class="auth-card">
      <h1 class="auth-title">เข้าสู่ระบบ</h1>
      <p class="auth-subtitle">SE - Store System</p>

      <form id="loginForm">
        <div class="auth-form-group">
          <label for="username" class="auth-label">
            <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            <span>ชื่อผู้ใช้งาน หรือ อีเมล</span>
          </label>
          <input type="text" id="username" class="form-input auth-input" placeholder="กรอกชื่อผู้ใช้งาน" required autocomplete="username">
        </div>

        <div class="auth-form-group">
          <label for="password" class="auth-label">
            <svg class="ui-icon-xs" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
            <span>รหัสผ่าน</span>
          </label>
          <input type="password" id="password" class="form-input auth-input" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-primary btn-auth-submit">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 17l5-5-5-5v10zM4 19h16v2H4v-2z"/>
          </svg>
          <span>เข้าสู่ระบบ</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>ยังไม่มีบัญชีผู้ใช้งาน? <a href="#">ลงทะเบียนผู้ใช้ใหม่</a></p>
      </div>
    </div>
  </main>

  <!-- ส่วนท้ายหน้าเว็บ -->
  <app-footer></app-footer>

  <!-- สคริปต์การทำงาน -->
  <script src="../assets/js/components/AppHeader.js"></script>
  <script src="../assets/js/components/AppFooter.js"></script>
  <script src="../assets/js/pages/login.js"></script>
</body>
</html>
